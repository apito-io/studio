name: Release Studio

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Public engine tag baked into the image
        required: true
        type: string
      console_ref:
        description: Public console tag baked into the image
        required: true
        type: string
  repository_dispatch:
    types: [component_ready]

concurrency:
  group: studio-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the finished build
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPONENT: ${{ github.event.client_payload.component }}
          COMPONENT_REF: ${{ github.event.client_payload.ref }}
          INPUT_ENGINE_REF: ${{ inputs.engine_ref }}
          INPUT_CONSOLE_REF: ${{ inputs.console_ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          tag = re.compile(r"^v[0-9A-Za-z._+-]+$")
          pins = json.load(open("pins.json"))
          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              pins["engine_ref"] = os.environ["INPUT_ENGINE_REF"]
              pins["console_ref"] = os.environ["INPUT_CONSOLE_REF"]
          else:
              component = os.environ["COMPONENT"]
              ref = os.environ["COMPONENT_REF"]
              if component not in ("engine", "console"):
                  raise SystemExit(f"unexpected component {component!r}")
              if not tag.match(ref or ""):
                  raise SystemExit(f"unexpected ref {ref!r}")
              pins[f"{component}_ref"] = ref
          for key in ("engine_ref", "console_ref"):
              value = pins.get(key) or ""
              if value and not tag.match(value):
                  raise SystemExit(f"unexpected {key} {value!r}")
          with open("pins.json", "w", encoding="utf-8") as handle:
              json.dump(pins, handle, indent=2)
              handle.write("\n")
          ready = bool(pins.get("engine_ref") and pins.get("console_ref"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"engine_ref={pins.get('engine_ref','')}\n")
              handle.write(f"console_ref={pins.get('console_ref','')}\n")
              handle.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Save the pin and wait for the other build
        if: steps.refs.outputs.ready != 'true'
        run: |
          git config user.name "apito-studio"
          git config user.email "studio@apito.io"
          git add pins.json
          if git diff --cached --quiet; then
            echo "Pin already recorded. Waiting for the other build."
            exit 0
          fi
          git commit -m "Record finished public build"
          git push
          echo "Waiting for both the engine build and the console build before creating an image."

      - name: Download public engine and console
        if: steps.refs.outputs.ready == 'true'
        env:
          ENGINE_REF: ${{ steps.refs.outputs.engine_ref }}
          CONSOLE_REF: ${{ steps.refs.outputs.console_ref }}
        run: sh scripts/download-public.sh

      - name: Bump Studio patch version
        if: steps.refs.outputs.ready == 'true'
        id: version
        env:
          ENGINE_REF: ${{ steps.refs.outputs.engine_ref }}
          CONSOLE_REF: ${{ steps.refs.outputs.console_ref }}
        run: |
          current=$(tr -d '[:space:]' < VERSION)
          major=${current%%.*}
          rest=${current#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"
          {
            echo "## v${next}"
            echo
            echo "- Studio image: ghcr.io/apito-io/studio:v${next}"
            echo "- Engine tag: ${ENGINE_REF}"
            echo "- Console tag: ${CONSOLE_REF}"
            echo "- What changed: baked public engine ${ENGINE_REF} and public console ${CONSOLE_REF} after both release builds finished."
            echo
          } | cat - CHANGELOG.md > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Build and push
        if: steps.refs.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "ghcr.io/apito-io/studio:v${VERSION}" -t ghcr.io/apito-io/studio:latest .
          docker push "ghcr.io/apito-io/studio:v${VERSION}"
          docker push ghcr.io/apito-io/studio:latest

      - name: Publish changelog
        if: steps.refs.outputs.ready == 'true'
        run: |
          git config user.name "apito-studio"
          git config user.email "studio@apito.io"
          git add VERSION pins.json CHANGELOG.md
          git commit -m "Release Studio v${{ steps.version.outputs.version }}"
          git push
